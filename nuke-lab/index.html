<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>100 kt lab</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #071018; color: #d7e4e2; font-family: ui-sans-serif, system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .hud { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
      header, .bar { pointer-events: auto; display: flex; gap: 8px; align-items: center; padding: 8px; padding-top: max(8px, env(safe-area-inset-top)); }
      .bar { padding-bottom: max(8px, env(safe-area-inset-bottom)); flex-wrap: wrap; }
      a, button {
        min-height: 48px; border-radius: 8px; border: 1px solid #2a3c44; background: #102028ee;
        color: inherit; padding: 0 14px; font: inherit; font-size: 14px; text-decoration: none;
        display: inline-flex; align-items: center; justify-content: center;
      }
      button.primary { background: #7dffa8; color: #062018; border-color: transparent; font-weight: 600; flex: 1; }
      button.on { background: #e8f4f1; color: #062018; }
      .meta { flex: 1; min-width: 0; font-family: ui-monospace, monospace; font-size: 12px; opacity: 0.8; }
      .readout { pointer-events: none; margin: 0 8px 6px; font-family: ui-monospace, monospace; font-size: 12px; opacity: 0.75; }
    </style>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div class="hud">
      <header>
        <a href="/">Theatre</a>
        <p class="meta" id="meta">100 kt · water</p>
      </header>
      <div>
        <p class="readout" id="readout"></p>
        <div class="bar">
          <button class="primary" id="boom" type="button">Detonate</button>
          <button class="on" id="water" type="button">Water</button>
          <button id="land" type="button">Land</button>
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
