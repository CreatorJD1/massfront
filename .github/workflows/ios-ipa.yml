# =============================================================================
# BUILD AN .ipa ON A MAC YOU DO NOT OWN
# -----------------------------------------------------------------------------
# An .ipa cannot be produced on Linux. It needs xcodebuild, the iOS SDK, and the
# Swift/Clang toolchain, all of which are macOS-only and licensed such that they
# cannot be redistributed. There is no cross-compiler and no honest shortcut.
#
# What there IS: GitHub hands out free macOS runners. This workflow rents one for
# a few minutes, builds the app there, and hands back a real .ipa as a download.
#
# Two modes, chosen by whether you have added signing secrets:
#
#   UNSIGNED (default, nothing to set up)
#     Builds with code signing switched off and packages the .app into an .ipa by
#     hand. iOS will not install this directly — nothing unsigned runs on a stock
#     iPhone — but Sideloadly (Windows/macOS) and AltStore take an unsigned .ipa
#     and re-sign it with your own free Apple ID at install time. That is the
#     path that needs no Mac and no developer account.
#
#   SIGNED (add the four secrets below)
#     Imports your certificate and provisioning profile and produces a properly
#     signed .ipa you can install directly or push to TestFlight.
#       IOS_CERT_P12_BASE64   base64 of your Apple Distribution .p12
#       IOS_CERT_PASSWORD     the .p12 password
#       IOS_PROFILE_BASE64    base64 of your .mobileprovision
#       IOS_TEAM_ID           your 10-character Apple Team ID
#
# Run it: Actions tab -> "Build iOS IPA" -> Run workflow. The .ipa appears under
# that run's Artifacts when it finishes.
# =============================================================================
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ipa:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # Playwright is a dev dependency used only for headless testing; its
        # browser download is ~150 MB of pure waste on a build runner.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Verify release freeze
        run: node tools/verify-release-freeze.mjs

      - name: Verify clean-checkout reproducibility
        run: node tools/verify-clean-checkout.mjs

      - name: Stage web assets and sync into the iOS project
        # pack-www verifies its own output — it fails loudly if index.html or
        # boot.js reference a file that did not make it into www/, which is
        # exactly the mistake that once shipped an app with no JavaScript.
        run: |
          node tools/pack-www.mjs
          npx cap sync ios

      - name: Decide signing mode
        id: mode
        run: |
          if [ -n "${{ secrets.IOS_CERT_P12_BASE64 }}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------- UNSIGNED ----------------
      - name: Build (unsigned)
        if: steps.mode.outputs.signed == 'false'
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package unsigned .ipa
        if: steps.mode.outputs.signed == 'false'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "App.app not found — build failed"; exit 1; }
          # An .ipa is nothing more than a zip with the bundle inside Payload/.
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry MASSFRONT-unsigned.ipa Payload)
          mv "$RUNNER_TEMP/MASSFRONT-unsigned.ipa" .
          ls -lh MASSFRONT-unsigned.ipa

      # ---------------- SIGNED ----------------
      - name: Install certificate and profile
        if: steps.mode.outputs.signed == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Archive and export (signed)
        if: steps.mode.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          mv "$RUNNER_TEMP/export/"*.ipa MASSFRONT.ipa
          ls -lh MASSFRONT.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MASSFRONT-ipa
          path: '*.ipa'
          if-no-files-found: error
          retention-days: 30
